<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator — Rumah Batik Lili</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pro-login-body">

    <div class="pro-login-container">
        <div class="pro-login-card">
            
            <div class="pro-card-header">
                <div class="pro-brand-icon">
                    <i class="ri-store-3-fill"></i>
                </div>
                <h1 class="pro-brand-title">Rumah Batik Lili</h1>
                <p class="pro-brand-subtitle">Sistem Informasi Penjualan & Inventori</p>
                <div class="pro-gold-divider"></div>
            </div>

            <div class="pro-card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="pro-alert pro-alert-danger">
                                <i class="ri-error-warning-fill"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="pro-field-group">
                        <label for="username">Username Administrator</label>
                        <div class="pro-input-wrap">
                            <i class="ri-user-line pro-icon"></i>
                            <input type="text" id="username" name="username" class="pro-input" placeholder="Masukkan username" required autofocus autocomplete="username">
                        </div>
                    </div>

                    <div class="pro-field-group">
                        <label for="password">Password</label>
                        <div class="pro-input-wrap">
                            <i class="ri-lock-line pro-icon"></i>
                            <input type="password" id="password" name="password" class="pro-input" placeholder="Masukkan password" required autocomplete="current-password">
                            <button type="button" id="togglePassword" class="pro-eye-toggle" aria-label="Tampilkan password">
                                <i class="ri-eye-off-line" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="pro-btn-submit">
                        Masuk Ke Dashboard
                    </button>
                </form>
            </div>

            <div class="pro-card-footer">
                <p>© 2026 Rumah Batik Lili • All Rights Reserved</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (togglePassword && passwordInput && toggleIcon) {
                togglePassword.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    toggleIcon.className = isPassword ? 'ri-eye-line' : 'ri-eye-off-line';
                });
            }
        });
    </script>
</body>
</html>
